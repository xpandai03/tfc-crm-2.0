# fly.toml app configuration file generated for tfc-crm-2026 on 2026-01-14T03:18:33Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tfc-crm-2026'
primary_region = 'lax'

[build]

# Mount volume for SQLite persistence (reminders database)
[mounts]
  source = "tfc_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1  # Keep at least 1 machine running for reminder cron
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
