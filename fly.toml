# fly.toml — Staging instance of TFC CRM
# IMPORTANT: This is the STAGING app. Production is tfc-crm-2026.
#
# See https://fly.io/docs/reference/configuration/

app = 'tfc-crm-2-0'
primary_region = 'sjc'

[build]

[mounts]
  source = "tfc_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
